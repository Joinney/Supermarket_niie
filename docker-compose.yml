version: '3.8'

services:
  # 1. Database
  db:
    image: postgres:15-alpine
    container_name: vdt_supermarket_db
    environment:
      POSTGRES_USER: ${DB_USER:-supermarket_db_exvs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-u0tGq1rZG5nb84Ek2siWlqzIDb9W8qO7}
      POSTGRES_DB: ${DB_NAME:-supermarket_db_exvs}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - demi_network
    restart: always

  # 2. Redis
  cache:
    image: redis:6-alpine
    container_name: demi_redis
    ports:
      - "6379:6379"
    networks:
      - demi_network
    restart: always

  # 3. AUTH SERVICE
  auth-service:
    build: ./backend-node/services/auth-service
    container_name: demi_auth_service
    ports:
      - "5001:5001"
    env_file: 
      - ./backend-node/services/auth-service/.env
    depends_on:
      - db
      - cache
    networks:
      - demi_network
    restart: on-failure

  # 4. PRODUCT SERVICE
  product-service:
    build: ./backend-node/services/product-service
    container_name: demi_product_service
    ports:
      - "5002:5002"
    extra_hosts:
      - "localhost:host-gateway"
    env_file: 
      - ./backend-node/services/product-service/.env
    depends_on:
      - db
      - cache
    networks:
      - demi_network
    restart: on-failure

  # 5. CART SERVICE (Cổng 5003)
  cart-service:
    build: ./backend-node/services/cart-service
    container_name: demi_cart_service
    ports:
      - "5003:5003"
    env_file: 
      - ./backend-node/services/cart-service/.env
    depends_on:
      - db
      - cache
    networks:
      - demi_network
    restart: on-failure
    
  # 6. PAYMENT SERVICE (Cổng 5004)
  payment-service:
    build: ./backend-node/services/payment-service
    container_name: demi_payment_service
    ports:
      - "5004:5004"
    env_file: 
      - ./backend-node/services/payment-service/.env
    depends_on:
      - db
      - cache
    networks:
      - demi_network
    restart: on-failure

  # 7. Frontend
  frontend:
    build: ./frontend-web
    container_name: vdt_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - inventory-service
    networks:
      - demi_network
    restart: always

  # 8. Uptime Kuma
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: demi_monitoring
    ports:
      - "3001:3001"
    volumes:
      - kuma_data:/app/data
    networks:
      - demi_network
    restart: always

  # 9. ORDER SERVICE (Cổng 5005)
  order-service:
    build: ./backend-node/services/order-service
    container_name: demi_order_service
    ports:
      - "5005:5005"
    env_file: 
      - ./backend-node/services/order-service/.env
    depends_on:
      - db
      - cache
    networks:
      - demi_network
    restart: on-failure

  # 10. INVENTORY SERVICE (Cổng 5006 - Viết bằng Go) 🚀
  inventory-service:
    build: ./backend-node/services/inventory-service
    container_name: demi_inventory_service
    ports:
      - "5006:5006"
    env_file:
      - ./backend-node/services/inventory-service/.env
    depends_on:
      - db
    networks:
      - demi_network
    restart: on-failure

  # 11. AI SERVICE (Cổng 8000)
  ai-service:
    build: ./ai-service
    container_name: demi_ai_service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    networks:
      - demi_network
    restart: on-failure

  # 12. RABBITMQ (Message Broker) 🐰
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - demi_network
    restart: always

  # 13. NOTIFICATION SERVICE (Cổng 8085 - Viết bằng Java Spring Boot) ✉️
  notification-service:
    build: ./backend-node/services/notification-service
    container_name: demi_notification_service
    ports:
      - "8085:8085"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_JACKSON_TIME_ZONE=Asia/Ho_Chi_Minh
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      - rabbitmq
    networks:
      - demi_network
    restart: on-failure

  # 14. PROMOTION SERVICE
  promotion-service:
    build: ./backend-node/services/promotion-service
    container_name: demi_promotion_service
    restart: always
    ports:
      - "5007:5007"
    env_file:
      - ./backend-node/services/promotion-service/.env
    environment:
      - PORT=5007
    depends_on:
      - db
    networks:
      - demi_network

  # 15. API GATEWAY
  api-gateway:
    build: ./backend-node/services/api-gateway
    container_name: demi_api_gateway
    ports:
      - "5000:5000"
    extra_hosts:
      - "localhost:host-gateway"
    env_file:
      - ./backend-node/services/api-gateway/.env
    networks:
      - demi_network
    restart: always

  # 16. N8N AUTOMATION WORKFLOW (Cổng 5678)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - demi_network
    restart: always

networks:
  demi_network:
    driver: bridge

volumes:
  pgdata:
  kuma_data:
  n8n_data: