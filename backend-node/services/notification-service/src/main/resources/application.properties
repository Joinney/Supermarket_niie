server.port=8085

# Cấu hình RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

notification.rabbitmq.exchange=notification.exchange
notification.rabbitmq.queue.email=notification.email.queue
notification.rabbitmq.routing.email=notification.email.routing

# Cấu hình gửi Mail (Ví dụ với Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true