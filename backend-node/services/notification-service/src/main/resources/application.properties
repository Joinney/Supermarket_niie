# Cấu hình cổng chạy ứng dụng
server.port=8085

# =======================================================================
# 1. CẤU HÌNH RABBITMQ
# =======================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Cấu hình Exchange & Queue phục vụ gửi Email
notification.rabbitmq.exchange=notification.exchange
notification.rabbitmq.queue.email=notification.email.queue
notification.rabbitmq.routing.email=notification.email.routing

# Cấu hình Queue phục vụ nhận sự kiện Đăng nhập (Real-time qua WebSocket)
notification.rabbitmq.queue.login=login.notification.queue

# =======================================================================
# 2. CẤU HÌNH GỬI MAIL (GMAIL SMTP)
# =======================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =======================================================================
# 3. CẤU HÌNH MONGODB
# =======================================================================
spring.data.mongodb.uri=${MONGO_URI}